name: Keep Neon DB Alive

on:
  schedule:
    # Run every 4 hours to keep the database active
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install @prisma/client prisma

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ping Database
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          
          async function pingDatabase() {
            try {
              await prisma.\$connect();
              const result = await prisma.\$queryRaw\`SELECT 1 as ping\`;
              console.log('✅ Database pinged successfully:', result);
              await prisma.\$disconnect();
            } catch (error) {
              console.error('❌ Database ping failed:', error);
              process.exit(1);
            }
          }
          
          pingDatabase();
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Log completion
        run: echo "Database keep-alive ping completed at $(date)"
